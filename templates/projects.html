<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ career_name }} - Projects</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #818cf8;
            --background-color: #f3f4f6;
            --card-background: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-background);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .project-card {
            background-color: #f8f9fc;
            padding: 1rem;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }

        .project-card:hover {
            background-color: #eef2ff;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
            text-decoration: none;
        }

        .project-title:hover {
            text-decoration: underline;
        }

        .project-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ career_name }} - Projects</h1>
            <p class="subtitle">Explore curated projects designed for your skill level</p>
        </div>

        <div class="project-list">
            {% for project in projects %}
<div class="project-card">
    <a href="{{ project.link }}" class="project-title" target="_blank">{{ project.title }}</a>
    <p class="project-description">{{ project.description }}</p>
</div>
{% endfor %}
        </div>

        <a href="/career/{{ career_name }}" class="back-link">← Back to Courses</a>
    </div>
</body>
</html>
